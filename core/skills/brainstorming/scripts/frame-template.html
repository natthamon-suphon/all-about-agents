<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>All About Agents Brainstorming</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73; --border: #d1d1d6; --accent: #0071e3; --selected: #e8f4fd; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1d1f; --panel: #2d2d2f; --text: #f5f5f7; --muted: #a1a1a6; --border: #48484a; --accent: #0a84ff; --selected: #143653; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; }
    .header { align-items: center; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: flex-end; min-height: 42px; padding: .5rem 1.25rem; }
    .status { color: var(--muted); font-size: .75rem; }
    .main { flex: 1; overflow-y: auto; }
    #frame-content { margin: 0 auto; max-width: 960px; min-height: 100%; padding: 2rem; }
    h2 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 .5rem; }
    h3 { font-size: 1.05rem; margin: 0 0 .25rem; }
    .subtitle { color: var(--muted); margin: 0 0 1.5rem; }
    .section { margin-bottom: 2rem; }
    .label { color: var(--muted); font-size: .7rem; letter-spacing: .05em; margin-bottom: .5rem; text-transform: uppercase; }
    .options { display: flex; flex-direction: column; gap: .75rem; }
    .option { background: var(--panel); border: 2px solid var(--border); border-radius: 12px; cursor: pointer; display: flex; gap: 1rem; padding: 1rem 1.25rem; }
    .option:hover, .option.selected { border-color: var(--accent); }
    .option.selected { background: var(--selected); }
    .option .letter { align-items: center; background: var(--border); border-radius: 6px; display: flex; flex: 0 0 1.75rem; font-weight: 600; height: 1.75rem; justify-content: center; }
    .option.selected .letter { background: var(--accent); color: #fff; }
    .option .content { flex: 1; }
    .option p { color: var(--muted); font-size: .875rem; margin: 0; }
    .cards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; overflow: hidden; }
    .card.selected { border: 2px solid var(--accent); }
    .card-image { align-items: center; aspect-ratio: 16/10; background: var(--border); display: flex; justify-content: center; }
    .card-body { padding: 1rem; }
    .card-body p { color: var(--muted); font-size: .875rem; margin: 0; }
    .mockup { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 1.5rem; overflow: hidden; }
    .mockup-header { background: var(--border); color: var(--muted); font-size: .75rem; padding: .5rem 1rem; }
    .mockup-body { padding: 1.5rem; }
    .split { display: grid; gap: 1.5rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 700px) { #frame-content { padding: 1rem; } .split { grid-template-columns: 1fr; } }
    .placeholder { border: 2px dashed var(--border); border-radius: 8px; color: var(--muted); padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <header class="header"><div class="status" aria-live="polite">Connecting.</div></header>
  <main class="main"><div id="frame-content"><!-- CONTENT --></div></main>
</body>
</html>
